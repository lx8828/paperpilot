[project]
name = "paperpilot"
version = "0.1.0"
description = "论文帮读器：把 PDF 变成结构化精读报告 + 带引用溯源的问答（每句结论都能点回原文）"
readme = "README.md"
authors = [
    { name = "lx", email = "834659376@qq.com" }
]
keywords = ["rag", "llm", "paper-reading", "question-answering", "citation",
            "fastapi", "langgraph", "chinese"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
paperpilot = "paperpilot:main"

[project.urls]
Repository = "https://github.com/lx8828/paperpilot"
Issues = "https://github.com/lx8828/paperpilot/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# 一条命令跑全部离线测试（CI 与"别人 clone 后自证"都用这条）：
#     uv run pytest -q
# · testpaths：只收集 tests/（qa/ 下是带叙述的评测脚本，不是单测）
# · -m 'not local'：默认**跳过**需要真实模型/LLM 的用例 → 无 key 也能全绿
# · -s：**关掉 pytest 的输出捕获**。原因（Windows 专有坑）：pytest 的捕获流
#   在创建时按 `sys.stdout.encoding` 定编码，Windows 上是 GBK，而生产代码会打印
#   `✔ / ⚠ / 中文` → 写捕获流时抛 UnicodeEncodeError，表现为**测试偶发失败**
#   （与业务无关，极难定位）。关掉捕获后输出直达已 reconfigure 成 UTF-8 的真实 stdout。
# · 本地跑真模型用例：uv run pytest -m local
testpaths = ["tests"]
addopts = "-q -m 'not local' -s"
markers = [
    "local: 需要真实模型 / LLM / GPU（本地跑；CI 与默认命令会跳过）",
]

[tool.basedpyright]
# 类型收敛策略（2026-09-05）：
#   Error 级已逐处修好（裸 dict 补泛型、TypedDict 访问、urllib.error 导入等）。
#   Any/Unknown 系是"内部 dict 数据流"的固有噪音（LLM 产物 JSON 无法静态定型），
#   无修复价值 → 关闭；保留 unused/字符串拼接等代码卫生告警。
#   cli/*.py 之间通过 sys.path 互引脚本，隐式相对导入是刻意设计 → 豁免。
typeCheckingMode = "standard"
pythonVersion = "3.13"
reportAny = "none"
reportExplicitAny = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportImplicitRelativeImport = "none"
reportPrivateUsage = "none"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
